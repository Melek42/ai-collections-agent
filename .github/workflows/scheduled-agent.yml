name: Scheduled agent run

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC = 09:00 in Addis Ababa
  workflow_dispatch:       # lets you run it by hand from the Actions tab

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up the backend (free hosting sleeps)
        run: >
          curl -fsS --retry 8 --retry-delay 15 --retry-all-errors --max-time 90
          "${{ secrets.BACKEND_URL }}/health"

      - name: Daily run (agent reviews invoices and drafts emails)
        run: >
          curl -fsS --max-time 600 -X POST
          -H "x-job-secret: ${{ secrets.JOB_SECRET }}"
          "${{ secrets.BACKEND_URL }}/jobs/daily-run"

      - name: Send approved emails
        run: >
          curl -fsS --max-time 300 -X POST
          -H "x-job-secret: ${{ secrets.JOB_SECRET }}"
          "${{ secrets.BACKEND_URL }}/jobs/flush-outbox"